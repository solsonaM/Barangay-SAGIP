name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barangay-sagip-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: PHP syntax check
        run: |
          find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: NPM security audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenization-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tokenization-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python dependency security audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import service modules
        run: python -c "import main; import tokenizer_classifier; print('Python service imports OK')"

      - name: Run tokenization service tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
