services:
  app:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - barangay-sagip-web/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      TOKENIZATION_SERVICE_URL: http://tokenization-service:8001
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      tokenization-service:
        condition: service_healthy
    networks:
      - backend

  queue-worker:
    build:
      context: .
      dockerfile: docker/queue-worker/Dockerfile
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - barangay-sagip-web/.env.production
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    networks:
      - backend

  ml-service:
    build:
      context: ./tokenization-service
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TOKENIZATION_SERVICE_KEY: ${TOKENIZATION_SERVICE_KEY:?Set TOKENIZATION_SERVICE_KEY}
      TOKENIZATION_CONFIDENCE_THRESHOLD: ${TOKENIZATION_CONFIDENCE_THRESHOLD:-0.45}
      TOKENIZATION_ASSIGNMENT_MIN_SCORE: ${TOKENIZATION_ASSIGNMENT_MIN_SCORE:-0.35}
      TOKENIZATION_ASSIGNMENT_MIN_MARGIN: ${TOKENIZATION_ASSIGNMENT_MIN_MARGIN:-0.05}
      TOKENIZATION_RULESET_VERSION: ${TOKENIZATION_RULESET_VERSION:-1.0.0}
    expose:
      - "8001"
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  laravel_storage:

networks:
  backend:
    driver: bridge
