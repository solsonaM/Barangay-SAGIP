services:
  app:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    restart: unless-stopped
    env_file:
      - barangay-sagip-web/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      TOKENIZATION_SERVICE_URL: http://ml-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./barangay-sagip-web/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  ml-service:
    build:
      context: ./tokenization-service
    restart: unless-stopped
    environment:
      TOKENIZATION_SERVICE_KEY: ${TOKENIZATION_SERVICE_KEY:?Set TOKENIZATION_SERVICE_KEY}
    expose:
      - "8001"
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
